source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 6
    noise = 0.02
    contrast = 1.1
    brightness = 0.85
    vibrancy = 0.15
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fade, 1, 4, ease
}

Relógio
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255,255,255,0.9)

    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 180
    halign = center
    valign = center
}

input-field {
    size = 420, 60

    position = 0, -40
    halign = center
    valign = center

    rounding = 14

    outer_color = rgba(255,255,255,0.15)
    inner_color = rgba(0,0,0,0.35)
    font_color = rgb(220,220,220)

    check_color = rgb(98, 114, 164)
    fail_color = rgb(255, 85, 85)

    outline_thickness = 2

    fade_on_empty = false
    placeholder_text = 󰌾  Digite sua senha

    shadow_passes = 2
    shadow_size = 4
}

auth {
    fingerprint:enabled = false
}
